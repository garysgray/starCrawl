<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=News+Cycle:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/style.css">
  <title>Star Crawl</title>
</head>
<body>

  <!-- ── Scene Layers ───────────────────────────────────────── -->
  <canvas id="stars"></canvas>
  <div id="nebula"></div>
  <canvas id="ships"></canvas>
  <div id="vignette"></div>
  <canvas id="noise"></canvas>
  <canvas id="space-object"></canvas>

  <!-- ── Crawl ──────────────────────────────────────────────── -->
  <div class="crawl-stage">
    <div class="crawl-perspective">
      <div class="crawl-content" id="crawl-content"></div>
    </div>
    <div class="crawl-fade-top"></div>
    <div class="crawl-fade-bottom"></div>
  </div>

  <!-- ── HUD ────────────────────────────────────────────────── -->
  <nav class="HUD" role="complementary" aria-label="Scene controls">

    <div class="control-group">
      <span class="control-label">Speed</span>
      <div class="btn-row">
        <button id="speed-slow">Slow</button>
        <button id="speed-med">Med</button>
        <button id="speed-fast">Fast</button>
      </div>
    </div>

    <div class="hud-divider"></div>

    <div class="control-group">
      <span class="control-label">Stars</span>
      <div class="btn-row">
        <button id="stars-calm">Calm</button>
        <button id="stars-drift">Drift</button>
        <button id="stars-warp">Warp</button>
      </div>
    </div>

    <div class="hud-divider"></div>

    <div class="control-group">
      <span class="control-label">Edit Text</span>
      <div class="btn-row">
        <button id="edit-text">Edit</button>
      </div>
    </div>

  </nav>

  <!-- ── Text Editor Overlay ────────────────────────────────── -->
  <div class="editor-overlay" id="editor-overlay">
    <div class="editor-box">

      <div class="editor-header">
        <span class="editor-title">Edit Crawl Text</span>
        <div style="display:flex; gap:8px; align-items:center;">
          <button class="editor-help-btn" id="editor-help-btn">?</button>
          <button class="editor-close"    id="editor-close">✕</button>
        </div>
      </div>

      <div class="editor-help" id="editor-help">
        <p><span class="help-code">#TITLE HERE</span> — large centered title</p>
        <p><span class="help-code">---</span> — large gap between segments</p>
        <p>Blank line between paragraphs splits them</p>
        <p>First line of editor = first thing seen on screen</p>
      </div>

      <textarea id="crawl-editor" spellcheck="false"></textarea>

      <div class="editor-footer">
        <button id="editor-apply">Apply</button>
        <button id="editor-reset">Reset</button>
      </div>

    </div>
  </div>

  <!-- ── Script Loading (Strict Dependency Order) ──────────── -->
  <!-- 1. Data Catalogs -->
  <script src="data/crawl-text.js"></script>
  <script src="data/CelestialCatalog.js"></script>
  <script src="data/ShipCatalog.js"></script>

  <!-- 2. Core Configuration & Base Classes -->
  <script src="js/Config.js"></script>
  <script src="js/SoundRecipes.js"></script>
  <script src="js/UIComponent.js"></script>
  <script src="js/AudioManager.js"></script>

  <!-- 3. Subsystem Managers & Coordinators -->
  <script src="js/UIManager.js"></script>
  <script src="js/SpaceDirector.js"></script>

  <!-- 4. Visual Entities & Specialized Renderers -->
  <script src="js/StarField.js"></script>
  <script src="js/Ship.js"></script>
  <script src="js/ShipRenderer.js"></script>
  <script src="js/SpaceObject.js"></script>
  <script src="js/SpaceObjectRenderer.js"></script>
  <script src="js/Crawl.js"></script>
  <script src="js/Hud.js"></script>
  <script src="js/Scene.js"></script>

  <!-- 5. Root Coordinator & Entry Point -->
  <script src="js/Engine.js"></script>
  <script src="js/Main.js"></script>

</body>
</html>
